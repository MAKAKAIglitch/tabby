plugins {
    id "fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

// Capture scalar values once so task action closures remain configuration-cache compatible.
def tabbyVersion = project.version.toString()
def tabbyArchiveName = project.archives_base_name.toString()

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/tabby.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", tabbyVersion

    filesMatching("fabric.mod.json") {
        expand "version": tabbyVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "LICENSE_${tabbyArchiveName}" }
    }
}

// Open the compiled mod directory after a successful local Windows build.
// Set TABBY_OPEN_MOD_FOLDER=0 to disable it; CI and non-Windows builds never open a GUI.
def tabbyBuildOutputPath = layout.buildDirectory.dir("libs").get().asFile.absolutePath
def tabbyOsName = System.getProperty("os.name", "").toLowerCase(Locale.ROOT)
def tabbyCiValue = (System.getenv("CI") ?: "").trim()
def tabbyAutoOpenSetting = (System.getenv("TABBY_OPEN_MOD_FOLDER") ?: "1").trim()
def tabbyShouldOpenModFolder = tabbyOsName.contains("windows")
    && !tabbyCiValue.equalsIgnoreCase("true")
    && tabbyAutoOpenSetting != "0"

tasks.named("build") {
    doLast {
        if (tabbyShouldOpenModFolder) {
            File modOutputDir = new File(tabbyBuildOutputPath)
            boolean containsModJar = modOutputDir.isDirectory()
                && (modOutputDir.listFiles()?.any {
                    it.isFile() && it.name.toLowerCase(Locale.ROOT).endsWith(".jar")
                } ?: false)

            if (containsModJar) {
                try {
                    new ProcessBuilder("explorer.exe", modOutputDir.absolutePath).start()
                    logger.lifecycle("Tabby: opened mod output folder: ${modOutputDir.absolutePath}")
                } catch (IOException exception) {
                    logger.warn("Tabby: could not open mod output folder: ${exception.message}")
                }
            }
        }
    }
}
