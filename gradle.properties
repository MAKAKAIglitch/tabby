# Fast incremental builds with a bounded memory footprint. runClient starts a second JVM,
# so keep the Gradle daemon below 4 GB to reduce OOM kills on desktop PCs.
org.gradle.jvmargs=-Xms256m -Xmx2G -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.entries-per-key=4
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true

minecraft_version=1.21.4
loader_version=0.16.14
loom_version=1.9.2
fabric_api_version=0.119.4+1.21.4

mod_version=0.1.0
maven_group=dev.tabby
archives_base_name=tabby
