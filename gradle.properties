# Bounded memory for Gradle and the Minecraft client.
org.gradle.jvmargs=-Xms256m -Xmx2G -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.entries-per-key=4
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true

minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.21
fabric_api_version=0.165.2+26.3

mod_version=0.1.0
maven_group=dev.tabby
archives_base_name=tabby
modmenu_version=21.0.0
