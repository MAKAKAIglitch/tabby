# Bounded memory for Gradle and the Minecraft client.
org.gradle.jvmargs=-Xms256m -Xmx2G -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.entries-per-key=4
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true

minecraft_version=26.2
loader_version=0.20.1
loom_version=1.17.21
fabric_api_version=0.161.0+26.2

mod_version=0.1.0
maven_group=dev.tabby
archives_base_name=tabby
modmenu_version=20.0.3
