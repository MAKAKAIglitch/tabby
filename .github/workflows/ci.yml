name: Build and client smoke test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew --no-daemon build

      - name: Launch Minecraft client and verify Tabby initialization
        shell: bash
        run: |
          set +e
          timeout 180s xvfb-run -a ./gradlew --no-daemon runClient 2>&1 | tee runclient.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 124 ] && grep -Fq "Tabby initialized for Minecraft 1.21.4." runclient.log; then
            echo "The client stayed running until the smoke-test timeout and loaded Tabby."
            exit 0
          fi

          echo "Client smoke test failed (exit code: $status)."
          exit 1
