name: Build Minecraft 1.21.11

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "fabric/1.21.11"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Java selector shell syntax
        if: runner.os == 'Linux'
        run: sh -n gradle/auto-java.sh

      - name: Verify wrapper selects Java 21
        shell: bash
        run: |
          ./gradlew --version | tee gradle-version.txt
          grep -Eq 'JVM:[[:space:]]+21([.]|[[:space:]])' gradle-version.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and export mod
        if: runner.os == 'Linux'
        run: ./gradlew build exportModJar

      - name: Verify exported JAR
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          test -s "dist/Tabby-${version}.jar"
          jar tf "dist/Tabby-${version}.jar" >/dev/null

      - name: Build with Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TABBY_NO_PAUSE = "1"
          & .\build-tabby.bat
          if ($LASTEXITCODE -ne 0) { throw "Windows launcher build failed: $LASTEXITCODE" }
